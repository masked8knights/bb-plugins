chor="middle">D</text><text x="410" y="621" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="700">Designer</text><text x="410" y="641" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" font-weight="400">user experience</text><rect x="410" y="651" width="56" height="25" rx="13" fill="#edf4ef" stroke="transparent" stroke-width="1"/><text x="438" y="668" fill="#b68a3b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9px" font-weight="600" text-anchor="middle" letter-spacing="0.2">voted</text><text x="650" y="474" fill="#187b72" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="800">Architect</text><text x="650" y="499" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="400">The migration is bounded, but the rollback path needs one explicit</text><text x="650" y="518" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="400">owner.</text><text x="650" y="568" fill="#b68a3b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="800">Designer</text><text x="650" y="593" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="400">Add a user-facing note before release. The behavior change is easy</text><text x="650" y="612" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="400">to miss.</text><rect x="650" y="674" width="470" height="54" rx="7" fill="#dff1ee"/><text x="670" y="707" fill="#187b72" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="650">Next: chief justice closes the round after the last vote.</text><text x="1210" y="492" fill="#17212b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30px" font-weight="800">2</text><text x="1252" y="491" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400">support</text><text x="1210" y="540" fill="#17212b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30px" font-weight="800">1</text><text x="1252" y="539" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400">abstain</text><text x="1210" y="588" fill="#17212b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30px" font-weight="800">0</text><text x="1252" y="587" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400">oppose</text><line x1="1208" y1="622" x2="1328" y2="622" stroke="#d6dde3" stroke-width="1"/><text x="1208" y="652" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700">Registered votes</text><text x="1328" y="652" fill="#187b72" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="800" text-anchor="end">2 / 3</text><rect x="1208" y="700" width="120" height="30" rx="7" fill="#ffffff" stroke="#d6dde3" stroke-width="1"/><text x="1268" y="720" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11p