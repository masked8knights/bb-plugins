sans-serif" font-size="12px" font-weight="400">Document the release owner</text><rect x="358" y="562" width="538" height="78" rx="8" fill="#e7f3eb" stroke="#c2dfcb" stroke-width="1"/><text x="382" y="592" fill="#237c59" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="750">Waiting for Plannotator</text><text x="382" y="614" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400">The review can stay open until you decide.</text><text x="358" y="704" fill="#8d9aa5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" font-weight="800" letter-spacing="0.8">Right panel</text><text x="358" y="728" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400">Persistent review tab · same-origin relay</text><text x="976" y="320" fill="#17212b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17px" font-weight="750">Plan review</text><rect x="1292" y="298" width="52" height="25" rx="13" fill="#e1f1e7" stroke="#e1f1e7" stroke-width="1"/><text x="1318" y="315" fill="#2c865b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="600" text-anchor="middle" letter-spacing="0.2">OPEN</text><text x="976" y="363" fill="#25303b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15px" font-weight="700">Migration plan</text><text x="976" y="387" fill="#687784" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400">3 steps · 1 note</text><rect x="976" y="408" width="356" height="50" rx="7" fill="#fbfcfd" stroke="#d6dde3" stroke-width="1"/>