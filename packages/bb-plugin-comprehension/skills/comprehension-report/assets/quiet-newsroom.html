<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { --paper:#f5f6f7; --ink:#182230; --body:#344458; --muted:#66758a; --line:#d8dee6; --accent:#1f5fa8; --accent-soft:#e7eff9; --code:#eaf0f5; --max:1120px; }
    html[data-theme="dark"] { --paper:#17212b; --ink:#f1f4f7; --body:#c8d2dc; --muted:#97a8b8; --line:#34424f; --accent:#8eb9e8; --accent-soft:#223b54; --code:#24323f; }
    * { box-sizing:border-box; } html { background:var(--paper); color:var(--body); font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } body { margin:0; }
    .frame { max-width:var(--max); margin:0 auto; padding:42px 32px 80px; } .theme { position:fixed; top:20px; right:24px; width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:var(--paper); color:var(--ink); cursor:pointer; font-size:18px; } .theme .sun { display:none; } html[data-theme="dark"] .theme .moon { display:none; } html[data-theme="dark"] .theme .sun { display:inline; }
    .intro { max-width:760px; padding:18px 0 48px; } h1,h2,h3 { color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-weight:500; letter-spacing:-.025em; line-height:1.15; } h1 { margin:0 0 18px; font-size:clamp(2.5rem,6vw,4.8rem); } .dek { margin:0; color:var(--body); font:1.18rem/1.55 Georgia,"Times New Roman",serif; }
    .layout { display:grid; grid-template-columns:minmax(0,760px) 220px; gap:72px; align-items:start; } .article { min-width:0; } .section { margin:0 0 58px; scroll-margin-top:28px; }
    .section-toggle { display:flex; gap:14px; align-items:baseline; width:100%; padding:0 0 14px; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink); cursor:pointer; text-align:left; } .section-toggle h2 { margin:0; font-size:clamp(1.65rem,3vw,2.25rem); } .section-number { color:var(--accent); font:600 .8rem/1 system-ui,sans-serif; letter-spacing:.08em; } .chevron { margin-left:auto; color:var(--muted); transition:transform .2s; } .section[data-open="true"] .chevron { transform:rotate(180deg); } .section-body { padding-top:20px; } .section[data-open="false"] .section-body { display:none; }
    p { margin:0 0 18px; } strong { color:var(--ink); } a { color:var(--accent); } .callout { margin:24px 0; padding:18px 20px; background:var(--accent-soft); border-radius:4px; } .callout p:last-child { margin-bottom:0; }
    table { width:100%; border-collapse:collapse; margin:24px 0; } th,td { padding:11px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; } th { color:var(--muted); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; } code { padding:.12em .3em; background:var(--code); border-radius:3px; color:var(--ink); font:.9em ui-monospace,SFMono-Regular,Menlo,monospace; } pre { overflow:auto; padding:16px; background:var(--code); border-radius:4px; } pre code { padding:0; background:none; }
    .diagram { margin:28px 0; } .diagram svg { display:block; width:100%; height:auto; } .caption { margin-top:8px; color:var(--muted); font-size:.85rem; } .toc { position:sticky; top:28px; padding-top:8px; } .toc-label { color:var(--muted); font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } .toc nav { margin-top:14px; } .toc a { display:block; padding:5px 0; color:var(--muted); font-size:.88rem; line-height:1.35; text-decoration:none; } .toc a:hover,.toc a.active { color:var(--accent); } .toc a.active { font-weight:700; }
    @media (max-width:980px) { .layout { grid-template-columns:1fr; gap:30px; } .toc { position:static; order:-1; padding:0 0 20px; border-bottom:1px solid var(--line); } .toc nav { display:flex; flex-wrap:wrap; gap:4px 18px; } } @media (max-width:640px) { .frame { padding:28px 20px 60px; } .theme { top:14px; right:14px; } }
  </style>
</head>
<body>
  <button class="theme" type="button" aria-label="Switch color theme"><span class="moon" aria-hidden="true">☾</span><span class="sun" aria-hidden="true">☀</span></button>
  <main class="frame"><header class="intro"><h1>{{TITLE}}</h1><p class="dek">{{DEK}}</p></header><div class="layout"><article class="article">{{CONTENT}}</article><aside class="toc"><div class="toc-label">On this page</div><nav>{{TOC}}</nav></aside></div></main>
  <script>
    const root=document.documentElement; let saved=null; try { saved=localStorage.getItem('comprehension-theme'); } catch {} if(saved) root.dataset.theme=saved; document.querySelector('.theme').addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;try { localStorage.setItem('comprehension-theme',next); } catch {}});
    document.querySelectorAll('.section-toggle').forEach((button)=>{button.setAttribute('aria-expanded','true');button.addEventListener('click',()=>{const section=button.closest('.section'),open=section.dataset.open!=='false';section.dataset.open=open?'false':'true';button.setAttribute('aria-expanded',String(!open));});});
    const links=[...document.querySelectorAll('.toc a')],sections=links.map((link)=>document.getElementById(link.getAttribute('href').slice(1))).filter(Boolean); if(sections.length){const observer=new IntersectionObserver((entries)=>entries.forEach((entry)=>{if(entry.isIntersecting)links.forEach((link)=>link.classList.toggle('active',link.getAttribute('href')==='#'+entry.target.id));}),{rootMargin:'-15% 0px -70% 0px'});sections.forEach((section)=>observer.observe(section));}
  </script>
</body>
</html>
